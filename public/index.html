<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartOKS Circuit — Electronics Workbench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo" data-icon="cpu"></span>
        <span class="brand-name">SmartOKS</span>
      </div>

      <nav id="palette" class="palette"></nav>

      <div class="support-card">
        <span class="support-illu" data-icon="support"></span>
        <div class="support-text">
          <b data-i18n="ui.needHelp">Потрібна допомога?</b>
          <span data-i18n="ui.contactFree">звертайтеся вільно</span>
        </div>
        <a id="supportBtn" class="support-btn" target="_blank" rel="noopener"
           href="https://github.com/mihasan1/SmartOKS_Circuit" data-i18n="ui.getSupport">Підтримка</a>
      </div>
    </aside>

    <!-- ===================== CONTENT ===================== -->
    <div class="content">
      <header class="topbar">
        <div class="topbar-title">
          <h1 data-i18n="ui.appTitle">Лабораторія схем</h1>
          <span id="status" class="status">Готово</span>
        </div>

        <div class="topbar-actions">
          <button id="btnRun" class="btn btn-primary" data-icon="play"><span data-i18n="ui.run">Запустити</span></button>
          <button id="btnStop" class="btn" disabled data-icon="stop"><span data-i18n="ui.stop">Стоп</span></button>
          <span class="divider"></span>
          <button id="btnRotate" class="btn btn-icon" data-icon="rotate" title="Rotate"></button>
          <button id="btnDelete" class="btn btn-icon" data-icon="trash" title="Delete"></button>
          <button id="btnSave" class="btn btn-icon" data-icon="save" title="Save"></button>
          <button id="btnLoad" class="btn btn-icon" data-icon="folder" title="Load"></button>
          <button id="btnClear" class="btn btn-icon" data-icon="clear" title="Clear"></button>
          <input type="file" id="fileInput" accept="application/json" hidden />
          <span class="divider"></span>

          <button id="btnHelp" class="btn btn-icon" data-icon="help" title="Help"></button>

          <button id="themeToggle" class="theme-toggle" title="Theme" aria-label="Toggle theme">
            <span class="tt-icon tt-sun" data-icon="sun"></span>
            <span class="tt-knob"></span>
            <span class="tt-icon tt-moon" data-icon="moon"></span>
          </button>

          <span class="lang-wrap">
            <span class="lang-globe" data-icon="globe"></span>
            <select id="langSel" class="lang-sel" title="Language / Мова">
              <option value="uk">Українська</option>
              <option value="en">English</option>
            </select>
          </span>

          <div class="user-chip">
            <span class="avatar">SO</span>
            <span class="user-name">SmartOKS</span>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="canvas-card">
          <canvas id="canvas"></canvas>
          <div id="hint" class="hint" data-i18n="ui.hint"></div>
          <div class="canvas-controls">
            <button id="zoomOut" class="btn btn-icon" data-icon="minus" title="Zoom out"></button>
            <span id="zoomLabel">100%</span>
            <button id="zoomIn" class="btn btn-icon" data-icon="plus" title="Zoom in"></button>
            <button id="zoomReset" class="btn btn-icon" data-icon="fit" title="Reset view"></button>
          </div>
        </section>

        <aside id="props" class="props-card">
          <h3 data-i18n="ui.props_title">Властивості</h3>
          <div id="propsBody"><p class="muted" data-i18n="ui.nothing_selected">Нічого не вибрано</p></div>
        </aside>
      </main>

      <section id="ladock" class="ladock hidden">
        <div class="ladock-head">
          <span class="la-title" data-i18n="la.title">Логічний аналізатор</span>
          <span class="la-win">
            <label data-i18n="la.window">Вікно (с)</label>
            <input type="number" id="laWindow" min="1" max="60" step="1" value="8" />
          </span>
          <button id="laClear" class="btn" data-i18n="la.clear">Очистити запис</button>
          <button id="laClose" class="btn btn-icon" data-icon="close"></button>
        </div>
        <canvas id="laCanvas"></canvas>
      </section>
    </div>
  </div>

  <!-- ===================== HELP MODAL ===================== -->
  <div id="helpModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h2 data-i18n="help.title">Довідка</h2>
        <button id="helpClose" class="btn btn-icon" data-icon="close"></button>
      </div>
      <div id="helpBody" class="modal-body"></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="engine.js"></script>
  <script src="components.js"></script>
  <script src="netlist.js"></script>
  <script src="editor.js"></script>
</body>
</html>
